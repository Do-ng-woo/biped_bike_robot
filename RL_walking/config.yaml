control:
  rate_hz: 50.0
  ready_time_sec: 3.0
  walking_ready_time_sec: 4.0
  walking_ready_settle_time_sec: 4.0
  walking_ready_level_warning_deg: 6.0
  walking_ready_max_tilt_deg: 12.0
  hip_pitch_tracking_integral_gain: 1.5
  hip_pitch_tracking_correction_max_deg: 8.0
  return_to_ready_time_sec: 3.0
  gyro_bias_samples: 100
  imu_startup_max_tilt_deg: 20.0
  imu_startup_max_gyro_rad_s: 0.35
  maximum_cycle_overrun_ms: 5.0
  maximum_tilt_deg: 35.0
  maximum_target_step_rad: 0.12
  maximum_normalized_observation: 15.0
  command_timeout_sec: 0.25

imu:
  virtual_dxl_id: 200
  # Retry malformed packets inside one cycle. Hold the last valid sample for up
  # to 10 consecutive 50 Hz cycles, then return safely to the ready posture.
  read_attempts: 3
  retry_delay_sec: 0.001
  maximum_consecutive_failures: 10
  recovery_samples: 10
  mount_roll_deg: -90.0
  mount_pitch_deg: 0.0
  mount_yaw_deg: 0.0
  rpy_remap: YRp

hardware:
  config_path: ../config/dynamixel_hardware.yaml
  state_read_attempts: 3
  state_retry_delay_sec: 0.002
  maximum_consecutive_state_failures: 10
  state_recovery_samples: 10

# XL430 Present Load and XM430 Present Current are approximate, not calibrated torque.
# The per-motor feedback type/current unit/stall current come from hardware.config_path.
torque_estimation:
  default_stall_torque_nm: 1.4
  joint_stall_torque_nm:
    l_knee_pitch_jnt: 3.0
    r_knee_pitch_jnt: 3.0
    l_foot_roll_jnt: 3.0
    r_foot_roll_jnt: 3.0
    arm_shoulder_pitch_jnt: 3.8

joint_limits:
  l_hip_yaw_jnt: [-0.436332, 0.436332]
  l_hip_roll_jnt: [-0.610865, 0.261799]
  l_hip_pitch_jnt: [-1.745330, 0.0]
  l_knee_pitch_jnt: [-2.094400, 0.0]
  l_ankle_pitch_jnt: [-1.570800, 1.483530]
  l_foot_roll_jnt: [-0.610865, 0.610865]
  r_hip_yaw_jnt: [-0.436332, 0.436332]
  r_hip_roll_jnt: [-0.261799, 0.610865]
  r_hip_pitch_jnt: [0.0, 1.745330]
  r_knee_pitch_jnt: [-2.094400, 0.0]
  r_ankle_pitch_jnt: [-1.570800, 1.483530]
  r_foot_roll_jnt: [-0.610865, 0.610865]
  arm_base_yaw_jnt: [-3.141590, 3.141590]
  arm_shoulder_pitch_jnt: [-1.919860, -1.221730]
  arm_elbow_pitch_jnt: [0.0, 0.174533]
  arm_wrist_pitch_jnt: [-1.570800, 0.0]
  arm_wrist_roll_jnt: [-3.141590, 3.141590]
